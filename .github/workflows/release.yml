name: Release

# Builds a signed release and publishes a GitHub Release whenever a commit
# lands on the default branch. The signing secrets are exposed ONLY to the
# gradle build step (not the whole job) to shrink the blast radius if a
# third-party action is ever compromised.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64   - base64 of your .jks/.keystore  (see note below)
#   RELEASE_STORE_PASSWORD    - keystore password
#   RELEASE_KEY_ALIAS         - key alias
#   RELEASE_KEY_PASSWORD      - key password
#
# Create RELEASE_KEYSTORE_BASE64 locally with:
#   macOS/Linux:  base64 -i upload-keystore.jks | pbcopy
#   Windows PS :  [Convert]::ToBase64String([IO.File]::ReadAllBytes("upload-keystore.jks")) | Set-Clipboard
#
# SECURITY: use your Play *upload* key here, not the app signing key held by
# Google. A leaked upload key can be reset from the Play Console; the app
# signing key cannot.

on:
  push:
    branches: [ main ]
    # Skip runs that only touch docs so we don't cut a release for a README edit.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# Prevent overlapping release runs racing to publish the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # needed to create the GitHub Release and tag

jobs:
  release:
    runs-on: ubuntu-latest
    # Gate the signing secrets behind a protected environment: add required
    # reviewers under Settings → Environments → release so a bare push cannot
    # trigger a signed build without approval. Remove this line to run unattended.
    environment: release
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install CMake for the native (FFmpeg/libusb) build
        run: sdkmanager "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Decode keystore and write local.properties
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> local.properties

      - name: Build signed AAB and APK
        run: ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=v${VERSION_NAME}+${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build release notes from the commit message
        id: notes
        run: |
          # Subject line (first line) of the triggering commit → Release title.
          SUBJECT=$(git log -1 --format=%s "${{ github.sha }}")
          {
            echo "subject<<__EOF__"
            echo "$SUBJECT"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          # Body only (everything after the subject line), exactly as authored.
          git log -1 --format=%b "${{ github.sha }}" > commit_message.txt
          # GitHub renders the release body as GFM, which collapses single
          # newlines. To keep the layout identical to the commit as written we
          # append a GFM hard break (two trailing spaces) to every non-empty
          # line: blank lines stay as paragraph separators and list markers
          # (-, *) still render as bullets.
          sed -E 's/[[:space:]]+$//; /./ s/$/  /' commit_message.txt > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.notes.outputs.subject }}
          body_path: RELEASE_NOTES.md
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
